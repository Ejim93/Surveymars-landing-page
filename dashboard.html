<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SurveyMars Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="surveymars-logo.png"
             alt="SurveyMars - Mentorship & Opportunities">
    </div>

</header>


<main>

    <section class="dashboard">

        <h1>Welcome to SurveyMars</h1>

        <p id="welcomeMessage">
            Loading your account...
        </p>


        <div class="dashboard-cards">

            <div class="dashboard-card">
                <h2>⭐ Points</h2>
                <p id="points">0</p>
            </div>


            <div class="dashboard-card">
                <h2>📋 Available Surveys</h2>
                <p>Coming soon</p>
            </div>


            <div class="dashboard-card">
                <h2>✅ Completed Surveys</h2>
                <p>0</p>
            </div>


            <div class="dashboard-card">
                <h2>🎁 Rewards</h2>
                <p>Coming soon</p>
            </div>

        </div>


        <button id="logoutButton">
            Log Out
        </button>

    </section>

</main>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDfY0BVSt_NIqUf3rwgPlRRXLJFLq7-7M8",
        authDomain: "surveymars-11698.firebaseapp.com",
        projectId: "surveymars-11698",
        storageBucket: "surveymars-11698.firebasestorage.app",
        messagingSenderId: "503727549780",
        appId: "1:503727549780:web:326a85d7b1f7eca730acc1"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const welcomeMessage =
        document.getElementById("welcomeMessage");

    const logoutButton =
        document.getElementById("logoutButton");


    // Check whether the user is logged in

    onAuthStateChanged(auth, (user) => {

        if (user) {

            const name =
                user.displayName || user.email;

            welcomeMessage.textContent =
                "Hello, " + name +
                "! Welcome to your SurveyMars dashboard.";

        } else {

            // User is not logged in

            window.location.href = "login.html";

        }

    });


    // Log out

    logoutButton.addEventListener("click", async () => {

        try {

            await signOut(auth);

            window.location.href = "login.html";

        } catch (error) {

            console.error(error);

        }

    });

</script>

</body>

</html>
