<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - SurveyMars</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="surveymars-logo.png"
             alt="SurveyMars - Mentorship & Opportunities">
    </div>

</header>


<main>

    <section class="dashboard">

        <h1>My SurveyMars Profile</h1>

        <p id="profileMessage">
            Loading your profile...
        </p>


        <form id="profileForm">

            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                required
            >


            <label for="ageRange">Age Range</label>

            <select id="ageRange" required>

                <option value="">Select your age range</option>
                <option value="18-24">18–24</option>
                <option value="25-34">25–34</option>
                <option value="35-44">35–44</option>
                <option value="45-54">45–54</option>
                <option value="55+">55+</option>

            </select>


            <label for="occupation">Occupation</label>

            <input
                type="text"
                id="occupation"
                placeholder="Enter your occupation"
                required
            >


            <label for="skills">Skills / Interests</label>

            <input
                type="text"
                id="skills"
                placeholder="e.g. Business, construction, technology"
                required
            >


            <label for="contactMethod">Preferred Mode of Contact</label>

            <select id="contactMethod" required>

                <option value="">Select contact method</option>
                <option value="Email">Email</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Phone">Phone</option>

            </select>


            <label>
                <input
                    type="checkbox"
                    id="communicationConsent"
                >

                I agree to receive relevant SurveyMars
                opportunities and communications.
            </label>


            <button type="submit">
                Save Profile
            </button>

        </form>


        <p>
            <a href="dashboard.html">Back to Dashboard</a>
        </p>

    </section>

</main>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

        apiKey: "AIzaSyDfY0BVSt_NIqUf3rwgPlRRXLJFLq7-7M8",

        authDomain: "surveymars-11698.firebaseapp.com",

        projectId: "surveymars-11698",

        storageBucket: "surveymars-11698.firebasestorage.app",

        messagingSenderId: "503727549780",

        appId: "1:503727549780:web:326a85d7b1f7eca730acc1"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const profileForm =
        document.getElementById("profileForm");

    const profileMessage =
        document.getElementById("profileMessage");


    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            window.location.href = "login.html";

            return;

        }


        try {

            const userRef =
                doc(db, "users", user.uid);

            const userSnapshot =
                await getDoc(userRef);


            if (userSnapshot.exists()) {

                const data = userSnapshot.data();


                document.getElementById("fullName").value =
                    data.fullName || user.displayName || "";


                document.getElementById("ageRange").value =
                    data.ageRange || "";


                document.getElementById("occupation").value =
                    data.occupation || "";


                document.getElementById("skills").value =
                    data.skills || "";


                document.getElementById("contactMethod").value =
                    data.contactMethod || "";


                document.getElementById("communicationConsent").checked =
                    data.communicationConsent || false;

            } else {

                document.getElementById("fullName").value =
                    user.displayName || "";

            }


            profileMessage.textContent =
                "Your profile is ready.";

        } catch (error) {

            console.error(error);

            profileMessage.textContent =
                "Unable to load your profile.";

        }

    });


    profileForm.addEventListener("submit", async (event) => {

        event.preventDefault();


        const user = auth.currentUser;


        if (!user) {

            window.location.href = "login.html";

            return;

        }


        try {

            profileMessage.textContent =
                "Saving your profile...";


            await setDoc(
                doc(db, "users", user.uid),
                {

                    fullName:
                        document.getElementById("fullName").value.trim(),

                    email: user.email,

                    ageRange:
                        document.getElementById("ageRange").value,

                    occupation:
                        document.getElementById("occupation").value.trim(),

                    skills:
                        document.getElementById("skills").value.trim(),

                    contactMethod:
                        document.getElementById("contactMethod").value,

                    communicationConsent:
                        document.getElementById("communicationConsent").checked,

                    updatedAt:
                        serverTimestamp()

                },
                { merge: true }
            );


            profileMessage.textContent =
                "Profile saved successfully!";

        } catch (error) {

            console.error(error);

            profileMessage.textContent =
                "Unable to save your profile. Please try again.";

        }

    });

</script>

</body>

</html>
