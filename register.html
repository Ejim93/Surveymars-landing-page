<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join SurveyMars</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="surveymars-logo.png"
                 alt="SurveyMars - Mentorship & Opportunities">
        </div>
    </header>

    <main>
        <section class="register-section">

            <h1>Join SurveyMars</h1>

            <p>
                Create your free account and discover survey
                opportunities, mentorship and other opportunities.
            </p>

            <form id="registerForm">

                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

                <button type="submit">Create Account</button>

                <p id="message"></p>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </section>
    </main>


    <!-- Firebase Authentication -->
    <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    // SurveyMars Firebase configuration

    const firebaseConfig = {
        apiKey: "AIzaSyDfY0BVSt_NIqUf3rwgPlRRXLJFLq7-7M8",
        authDomain: "surveymars-11698.firebaseapp.com",
        projectId: "surveymars-11698",
        storageBucket: "surveymars-11698.firebasestorage.app",
        messagingSenderId: "503727549780",
        appId: "1:503727549780:web:326a85d7b1f7eca730acc1"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Registration form

    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");


    registerForm.addEventListener("submit", async (event) => {

        event.preventDefault();


        const fullname =
            document.getElementById("fullname").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirm-password").value;


        // Check passwords

        if (password !== confirmPassword) {

            message.textContent = "Passwords do not match.";

            return;
        }


        try {

            message.textContent = "Creating your account...";


            // Create Firebase Authentication account

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user = userCredential.user;


            // Save user's name to Firebase profile

            await updateProfile(user, {
                displayName: fullname
            });


            // Create the user's Firestore document

            await setDoc(doc(db, "users", user.uid), {

    fullName: fullname,

    email: user.email,

    points: 0,

    status: "active",

    createdAt: serverTimestamp()

});


            message.textContent =
                "Account created successfully! Welcome to SurveyMars.";


            registerForm.reset();


        } catch (error) {

            console.error(error);


            if (error.code === "auth/email-already-in-use") {

                message.textContent =
                    "This email is already registered. Please log in.";

            } else if (error.code === "auth/invalid-email") {

                message.textContent =
                    "Please enter a valid email address.";

            } else if (error.code === "auth/weak-password") {

                message.textContent =
                    "Password must contain at least 6 characters.";

            } else if (error.code === "permission-denied") {

                message.textContent =
                    "Account created, but your profile could not be saved.";

            } else {

                message.textContent =
                    "Account creation failed. Please try again.";

            }

        }

    });

</script>
</body>

</html>
