<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SurveyMars Test Survey</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .survey-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .survey-card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
        }

        .question {
            margin-bottom: 25px;
        }

        .question h3 {
            margin-bottom: 12px;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            cursor: pointer;
        }

        .option input {
            margin-right: 8px;
        }

        #submitSurvey {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: orange;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #submitSurvey:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        <img
            src="surveymars-logo.png"
            alt="SurveyMars"
            style="max-width:180px;"
        >

    </div>

</header>


<main class="survey-container">


    <div class="survey-card">


        <h1>SurveyMars Test Survey</h1>


        <p>
            Complete all three questions to finish this test survey.
        </p>


        <p>
            <strong>
                Reward: 10 points
            </strong>
        </p>


        <form id="surveyForm">


            <!-- QUESTION 1 -->

            <div class="question">

                <h3>
                    1. Which type of opportunity are you most interested in?
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Surveys"
                        required
                    >

                    Surveys

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Mentorship"
                    >

                    Mentorship

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Learning"
                    >

                    Learning opportunities

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Business"
                    >

                    Business opportunities

                </label>

            </div>



            <!-- QUESTION 2 -->

            <div class="question">

                <h3>
                    2. How often would you like to receive new opportunities?
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="question2"
                        value="Daily"
                        required
                    >

                    Daily

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question2"
                        value="Weekly"
                    >

                    Weekly

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question2"
                        value="Monthly"
                    >

                    Monthly

                </label>

            </div>



            <!-- QUESTION 3 -->

            <div class="question">

                <h3>
                    3. How would you describe your interest in SurveyMars?
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="question3"
                        value="Very Interested"
                        required
                    >

                    Very interested

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question3"
                        value="Interested"
                    >

                    Interested

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question3"
                        value="Not Sure"
                    >

                    Not sure yet

                </label>

            </div>



            <!-- SUBMIT BUTTON -->

            <button
                type="submit"
                id="submitSurvey"
            >
                Submit Survey
            </button>


            <p id="message"></p>


        </form>


    </div>


</main>



<script type="module">


    // ==========================================
    // FIREBASE IMPORTS
    // ==========================================

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        updateDoc,
        doc,
        getDoc,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDfY0BVSt_NIqUf3rwgPlRRXLJFLq7-7M8",

        authDomain:
            "surveymars-11698.firebaseapp.com",

        projectId:
            "surveymars-11698",

        storageBucket:
            "surveymars-11698.firebasestorage.app",

        messagingSenderId:
            "503727549780",

        appId:
            "1:503727549780:web:326a85d7b1f7eca730acc1"

    };



    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    // ==========================================
    // ACTUAL FIRESTORE SURVEY ID
    // ==========================================

    /*
     * This is the actual Firestore document ID
     * for:
     *
     * SurveyMars Test 2
     *
     * surveys/t2jMm12vo6rAmLQxNOsM
     */

    const SURVEY_ID =
        "t2jMm12vo6rAmLQxNOsM";



    // ==========================================
    // VARIABLES
    // ==========================================

    let completionRef = null;

    let currentUser = null;

    let surveyReward = 0;



    // ==========================================
    // PAGE ELEMENTS
    // ==========================================

    const surveyForm =
        document.getElementById("surveyForm");


    const submitSurvey =
        document.getElementById("submitSurvey");


    const message =
        document.getElementById("message");



    // ==========================================
    // AUTHENTICATION
    // ==========================================

    onAuthStateChanged(
        auth,
        async (user) => {


            // ======================================
            // USER NOT LOGGED IN
            // ======================================

            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            // ======================================
            // SAVE CURRENT USER
            // ======================================

            currentUser =
                user;


            console.log(
                "SURVEYMARS USER:",
                user.uid
            );


            console.log(
                "SURVEYMARS EMAIL:",
                user.email
            );



            // ======================================
            // LOAD SURVEY FROM FIRESTORE
            // ======================================

            try {


                message.textContent =
                    "Loading survey...";



                const surveyRef =
                    doc(
                        db,
                        "surveys",
                        SURVEY_ID
                    );



                const surveySnapshot =
                    await getDoc(
                        surveyRef
                    );



                // ==================================
                // CHECK SURVEY EXISTS
                // ==================================

                if (
                    !surveySnapshot.exists()
                ) {

                    message.textContent =
                        "This survey could not be found.";

                    submitSurvey.disabled =
                        true;

                    return;

                }



                // ==================================
                // GET SURVEY DATA
                // ==================================

                const surveyData =
                    surveySnapshot.data();



                console.log(
                    "SURVEY DATA:",
                    surveyData
                );



                // ==================================
                // CHECK PUBLISHED STATUS
                // ==================================

                if (
                    surveyData.status !==
                    "published"
                ) {

                    message.textContent =
                        "This survey is not currently available.";

                    submitSurvey.disabled =
                        true;

                    return;

                }



                // ==================================
                // CHECK REWARD
                // ==================================

                if (
                    typeof surveyData.points !==
                    "number"
                ) {

                    message.textContent =
                        "This survey has an invalid reward configuration.";

                    submitSurvey.disabled =
                        true;

                    return;

                }



                // ==================================
                // STORE FIRESTORE REWARD
                // ==================================

                surveyReward =
                    surveyData.points;



                console.log(
                    "SURVEY REWARD:",
                    surveyReward
                );



                // ==================================
                // CREATE STARTED RECORD
                // ==================================

                message.textContent =
                    "Starting survey...";



                const completionsCollection =
                    collection(
                        db,
                        "surveyCompletions"
                    );



                completionRef =
                    await addDoc(
                        completionsCollection,
                        {

                            userId:
                                user.uid,

                            surveyId:
                                SURVEY_ID,

                            status:
                                "started",

                            points:
                                0,

                            verified:
                                false,

                            startedAt:
                                serverTimestamp()

                        }
                    );



                // ==================================
                // START SUCCESS
                // ==================================

                console.log(
                    "SURVEY STARTED"
                );


                console.log(
                    "Completion ID:",
                    completionRef.id
                );


                message.textContent =
                    "Survey ready. Please answer all three questions.";


            }

            catch (error) {


                console.error(
                    "SURVEY START ERROR:",
                    error
                );


                console.error(
                    "ERROR CODE:",
                    error.code
                );


                console.error(
                    "ERROR MESSAGE:",
                    error.message
                );


                message.textContent =
                    "Unable to start the survey: " +
                    (
                        error.message ||
                        "Unknown error"
                    );


                submitSurvey.disabled =
                    true;

            }

        }
    );



    // ==========================================
    // SURVEY SUBMISSION
    // ==========================================

    surveyForm.addEventListener(
        "submit",
        async (event) => {


            event.preventDefault();



            // ======================================
            // CHECK USER
            // ======================================

            if (!currentUser) {

                message.textContent =
                    "Please log in first.";

                return;

            }



            // ======================================
            // CHECK STARTED RECORD
            // ======================================

            if (!completionRef) {

                message.textContent =
                    "The survey has not started correctly. Please refresh the page and try again.";

                return;

            }



            // ======================================
            // GET ANSWERS
            // ======================================

            const question1 =
                document.querySelector(
                    'input[name="question1"]:checked'
                );


            const question2 =
                document.querySelector(
                    'input[name="question2"]:checked'
                );


            const question3 =
                document.querySelector(
                    'input[name="question3"]:checked'
                );



            // ======================================
            // CHECK ALL QUESTIONS
            // ======================================

            if (
                !question1 ||
                !question2 ||
                !question3
            ) {

                message.textContent =
                    "Please answer all three questions.";

                return;

            }



            // ======================================
            // DISABLE SUBMIT BUTTON
            // ======================================

            submitSurvey.disabled =
                true;


            submitSurvey.textContent =
                "Submitting...";


            message.textContent =
                "Submitting your survey...";



            // ======================================
            // COMPLETE SURVEY
            // ======================================

            try {


                await updateDoc(
                    completionRef,
                    {

                        status:
                            "completed",

                        verified:
                            true,

                        points:
                            surveyReward,

                        completedAt:
                            serverTimestamp(),

                        answers: {

                            question1:
                                question1.value,

                            question2:
                                question2.value,

                            question3:
                                question3.value

                        }

                    }
                );



                // ==================================
                // SUCCESS
                // ==================================

                console.log(
                    "SURVEY COMPLETED SUCCESSFULLY"
                );


                message.textContent =
                    "Survey completed successfully! You earned " +
                    surveyReward +
                    " points.";


                submitSurvey.textContent =
                    "Survey Completed";



                // ==================================
                // RETURN TO DASHBOARD
                // ==================================

                setTimeout(
                    () => {

                        window.location.href =
                            "dashboard.html";

                    },
                    1500
                );


            }

            catch (error) {


                // ==================================
                // SUBMISSION ERROR
                // ==================================

                console.error(
                    "SURVEY SUBMISSION ERROR:",
                    error
                );


                console.error(
                    "ERROR CODE:",
                    error.code
                );


                console.error(
                    "ERROR MESSAGE:",
                    error.message
                );


                message.textContent =
                    "Survey submission failed: " +
                    (
                        error.message ||
                        "Unknown error"
                    );


                submitSurvey.disabled =
                    false;


                submitSurvey.textContent =
                    "Submit Survey";

            }

        }
    );


</script>


</body>

</html>
