<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SurveyMars Test Survey</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .survey-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .survey-card {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
        }

        .question {
            margin-bottom: 25px;
        }

        .question h3 {
            margin-bottom: 12px;
        }

        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            cursor: pointer;
        }

        .option input {
            margin-right: 8px;
        }

        #submitSurvey {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: orange;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #submitSurvey:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        <img
            src="surveymars-logo.png"
            alt="SurveyMars"
            style="max-width:180px;"
        >

    </div>

</header>



<main class="survey-container">


    <div class="survey-card">


        <h1>SurveyMars Test Survey</h1>


        <p>
            Complete all three questions to finish this test survey.
        </p>


        <p>
            <strong>
                Reward: 10 points
            </strong>
        </p>



        <form id="surveyForm">


            <!-- QUESTION 1 -->

            <div class="question">

                <h3>
                    1. Which type of opportunity are you most interested in?
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Surveys"
                        required
                    >

                    Surveys

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Mentorship"
                    >

                    Mentorship

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Learning"
                    >

                    Learning opportunities

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question1"
                        value="Business"
                    >

                    Business opportunities

                </label>

            </div>



            <!-- QUESTION 2 -->

            <div class="question">

                <h3>
                    2. How often would you like to receive new opportunities?
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="question2"
                        value="Daily"
                        required
                    >

                    Daily

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question2"
                        value="Weekly"
                    >

                    Weekly

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question2"
                        value="Monthly"
                    >

                    Monthly

                </label>

            </div>



            <!-- QUESTION 3 -->

            <div class="question">

                <h3>
                    3. How would you describe your interest in SurveyMars?
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="question3"
                        value="Very Interested"
                        required
                    >

                    Very interested

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question3"
                        value="Interested"
                    >

                    Interested

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="question3"
                        value="Not Sure"
                    >

                    Not sure yet

                </label>

            </div>



            <button
                type="submit"
                id="submitSurvey"
            >
                Submit Survey
            </button>


            <p id="message"></p>


        </form>


    </div>


</main>



<script type="module">


    // ==========================================
    // FIREBASE IMPORTS
    // ==========================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        updateDoc,
        doc,
        getDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDfY0BVSt_NIqUf3rwgPlRRXLJFLq7-7M8",

        authDomain:
            "surveymars-11698.firebaseapp.com",

        projectId:
            "surveymars-11698",

        storageBucket:
            "surveymars-11698.firebasestorage.app",

        messagingSenderId:
            "503727549780",

        appId:
            "1:503727549780:web:326a85d7b1f7eca730acc1"

    };



    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    // ==========================================
    // ACTUAL FIRESTORE SURVEY DOCUMENT
    // ==========================================

    const SURVEY_ID =
        "t2jMm12vo6rAmLQxNOsM";



    // ==========================================
    // VARIABLES
    // ==========================================

    let completionRef = null;

    let currentUser = null;



    // ==========================================
    // PAGE ELEMENTS
    // ==========================================

    const surveyForm =
        document.getElementById("surveyForm");


    const submitSurvey =
        document.getElementById("submitSurvey");


    const message =
        document.getElementById("message");



    // ==========================================
    // AUTHENTICATION
    // ==========================================

    onAuthStateChanged(
        auth,
        async (user) => {


            // ======================================
            // NOT LOGGED IN
            // ======================================

            if (!user) {

                message.textContent =
                    "You must be logged in to take this survey.";

                submitSurvey.disabled =
                    true;

                return;

            }


            // ======================================
            // SAVE USER
            // ======================================

            currentUser =
                user;


            console.log(
                "SURVEYMARS USER:",
                user.uid
            );


            console.log(
                "SURVEYMARS EMAIL:",
                user.email
            );



            // ======================================
            // STEP 1 — READ SURVEY
            // ======================================

            message.textContent =
                "Checking survey...";


            try {


                const surveyRef =
                    doc(
                        db,
                        "surveys",
                        SURVEY_ID
                    );


                const surveySnapshot =
                    await getDoc(
                        surveyRef
                    );


                if (
                    !surveySnapshot.exists()
                ) {

                    message.textContent =
                        "ERROR: Survey document was not found.";

                    submitSurvey.disabled =
                        true;

                    console.error(
                        "SURVEY READ FAILED: DOCUMENT DOES NOT EXIST"
                    );

                    return;

                }


                const surveyData =
                    surveySnapshot.data();


                console.log(
                    "SURVEY DOCUMENT:",
                    surveyData
                );


                if (
                    surveyData.status !==
                    "published"
                ) {

                    message.textContent =
                        "ERROR: This survey is not published.";

                    submitSurvey.disabled =
                        true;

                    return;

                }


                console.log(
                    "SURVEY READ SUCCESSFUL"
                );


            }

            catch (error) {


                console.error(
                    "SURVEY READ FAILED"
                );


                console.error(
                    "ERROR CODE:",
                    error.code
                );


                console.error(
                    "ERROR MESSAGE:",
                    error.message
                );


                message.textContent =
                    "SURVEY READ FAILED: " +
                    (
                        error.message ||
                        "Unknown error"
                    );


                submitSurvey.disabled =
                    true;


                return;

            }



            // ======================================
            // STEP 2 — CREATE STARTED RECORD
            // ======================================

            message.textContent =
                "Starting survey...";


            try {


                const completionsCollection =
                    collection(
                        db,
                        "surveyCompletions"
                    );


                completionRef =
                    await addDoc(
                        completionsCollection,
                        {

                            userId:
                                user.uid,

                            surveyId:
                                SURVEY_ID,

                            status:
                                "started",

                            points:
                                0,

                            verified:
                                false,

                            startedAt:
                                serverTimestamp()

                        }
                    );


                console.log(
                    "SURVEY START RECORD CREATED"
                );


                console.log(
                    "COMPLETION ID:",
                    completionRef.id
                );


                message.textContent =
                    "Survey ready. Please answer all three questions.";


            }

            catch (error) {


                console.error(
                    "START RECORD CREATION FAILED"
                );


                console.error(
                    "ERROR CODE:",
                    error.code
                );


                console.error(
                    "ERROR MESSAGE:",
                    error.message
                );


                message.textContent =
                    "START RECORD FAILED: " +
                    (
                        error.message ||
                        "Unknown error"
                    );


                submitSurvey.disabled =
                    true;


                return;

            }

        }
    );



    // ==========================================
    // SUBMIT SURVEY
    // ==========================================

    surveyForm.addEventListener(
        "submit",
        async (event) => {


            event.preventDefault();



            // ======================================
            // CHECK USER
            // ======================================

            if (!currentUser) {

                message.textContent =
                    "Please log in first.";

                return;

            }



            // ======================================
            // CHECK START RECORD
            // ======================================

            if (!completionRef) {

                message.textContent =
                    "Survey start record is missing. Please refresh the page.";

                return;

            }



            // ======================================
            // GET ANSWERS
            // ======================================

            const question1 =
                document.querySelector(
                    'input[name="question1"]:checked'
                );


            const question2 =
                document.querySelector(
                    'input[name="question2"]:checked'
                );


            const question3 =
                document.querySelector(
                    'input[name="question3"]:checked'
                );



            // ======================================
            // VALIDATE ANSWERS
            // ======================================

            if (
                !question1 ||
                !question2 ||
                !question3
            ) {

                message.textContent =
                    "Please answer all three questions.";

                return;

            }



            // ======================================
            // DISABLE BUTTON
            // ======================================

            submitSurvey.disabled =
                true;


            submitSurvey.textContent =
                "Submitting...";


            message.textContent =
                "Submitting your survey...";



            // ======================================
            // COMPLETE RECORD
            // ======================================

            try {


               await updateDoc(
    completionRef,
    {
        status:
            "pending",

        verified:
            false,

        points:
            0,

        submittedAt:
            serverTimestamp(),

        answers: { 

                            question1:
                                question1.value,

                            question2:
                                question2.value,

                            question3:
                                question3.value

                        }

                    }
                );


                console.log(
                    "SURVEY COMPLETED SUCCESSFULLY"
                );


            message.textContent =
    "Survey submitted successfully! Your response is awaiting verification.";

                
            submitSurvey.textContent =
                   "Submitted for Verification";


                // ==================================
                // RETURN TO DASHBOARD
                // ==================================

                setTimeout(
    () => {

        window.location.href =
            "dashboard.html";

    },
    2500
);


            }

            catch (error) {


                console.error(
                    "SURVEY COMPLETION FAILED"
                );


                console.error(
                    "ERROR CODE:",
                    error.code
                );


                console.error(
                    "ERROR MESSAGE:",
                    error.message
                );


                message.textContent =
                    "SURVEY COMPLETION FAILED: " +
                    (
                        error.message ||
                        "Unknown error"
                    );


                submitSurvey.disabled =
                    false;


                submitSurvey.textContent =
                    "Submit Survey";

            }

        }
    );


</script>


</body>

</html>
