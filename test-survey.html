<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join SurveyMars</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="surveymars-logo.png"
                 alt="SurveyMars - Mentorship & Opportunities">
        </div>
    </header>

    <main>
        <section class="register-section">

            <h1>Join SurveyMars</h1>

            <p>
                Create your free account and discover survey
                opportunities, mentorship and other opportunities.
            </p>

            <form id="registerForm">

                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="confirm-password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

                <button type="submit" id="registerButton">
                    Create Account
                </button>

                <p id="message"></p>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </section>
    </main>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        // ==============================
        // FIREBASE CONFIGURATION
        // ==============================

        const firebaseConfig = {

            apiKey: "AIzaSyDfY0BVSt_NIqUf3rwgPlRRXLJFLq7-7M8",

            authDomain: "surveymars-11698.firebaseapp.com",

            projectId: "surveymars-11698",

            storageBucket: "surveymars-11698.firebasestorage.app",

            messagingSenderId: "503727549780",

            appId: "1:503727549780:web:326a85d7b1f7eca730acc1"

        };


        // ==============================
        // INITIALIZE FIREBASE
        // ==============================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // ==============================
        // PAGE ELEMENTS
        // ==============================

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");

        const registerButton =
            document.getElementById("registerButton");


        // ==============================
        // REGISTRATION
        // ==============================

        registerForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const fullname =
                    document.getElementById("fullname")
                        .value
                        .trim();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;

                const confirmPassword =
                    document.getElementById("confirm-password")
                        .value;


                // ==============================
                // CHECK PASSWORDS
                // ==============================

                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                try {

                    registerButton.disabled = true;

                    registerButton.textContent =
                        "Creating account...";

                    message.textContent =
                        "Creating your SurveyMars account...";


                    // ==============================
                    // CREATE AUTHENTICATION ACCOUNT
                    // ==============================

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    console.log(
                        "AUTHENTICATION ACCOUNT CREATED"
                    );

                    console.log(
                        "Email:",
                        user.email
                    );

                    console.log(
                        "UID:",
                        user.uid
                    );


                    // ==============================
                    // SAVE DISPLAY NAME
                    // ==============================

                    await updateProfile(
                        user,
                        {
                            displayName: fullname
                        }
                    );


                    // ==============================
                    // CREATE FIRESTORE USER PROFILE
                    // ==============================

                    message.textContent =
                        "Creating your SurveyMars profile...";


                    const userRef =
                        doc(
                            db,
                            "users",
                            user.uid
                        );


                    await setDoc(
                        userRef,
                        {

                            fullName: fullname,

                            email: user.email,

                            points: 0,

                            status: "active",

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    console.log(
                        "FIRESTORE USER PROFILE CREATED"
                    );

                    console.log(
                        "users/" + user.uid
                    );


                    // ==============================
                    // SUCCESS
                    // ==============================

                    message.textContent =
                        "Account created successfully! Welcome to SurveyMars.";

                    registerButton.textContent =
                        "Account Created";


                    registerForm.reset();


                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    }, 1500);


                } catch (error) {

                    console.error(
                        "SURVEYMARS REGISTRATION ERROR:",
                        error
                    );


                    // ==============================
                    // SHOW EXACT FIREBASE ERROR
                    // ==============================

                    const errorCode =
                        error.code || "unknown";

                    const errorMessage =
                        error.message || "No error message available.";


                    console.error(
                        "ERROR CODE:",
                        errorCode
                    );

                    console.error(
                        "ERROR MESSAGE:",
                        errorMessage
                    );


                    // ==============================
                    // USER-FRIENDLY MESSAGES
                    // ==============================

                    if (
                        errorCode ===
                        "auth/email-already-in-use"
                    ) {

                        message.textContent =
                            "This email is already registered. Please use another email or log in.";

                    } else if (
                        errorCode ===
                        "auth/invalid-email"
                    ) {

                        message.textContent =
                            "Please enter a valid email address.";

                    } else if (
                        errorCode ===
                        "auth/weak-password"
                    ) {

                        message.textContent =
                            "Password must contain at least 6 characters.";

                    } else if (
                        errorCode ===
                        "permission-denied" ||
                        errorCode ===
                        "firestore/permission-denied"
                    ) {

                        message.textContent =
                            "Authentication succeeded, but Firestore rejected the user profile. Error: " +
                            errorCode;

                    } else {

                        message.textContent =
                            "Registration error: " +
                            errorCode +
                            " — " +
                            errorMessage;

                    }


                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Create Account";

                }

            }
        );

    </script>

</body>

</html>
